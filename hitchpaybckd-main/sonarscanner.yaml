version: 0.2
# env:
#   secrets-manager:
#     LOGIN: prod/sonar:sonartoken
#     HOST: prod/sonar:HOST
#     Organization: prod/sonar:Organization
#     Project: prod/sonar:Project
phases:
    install:
        commands:
            - apt-get update
            - apt-get install -y jq
            - wget -O sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.0.2.4839-linux-x64.zip"
            - unzip sonar-scanner.zip
            - export PATH=$PATH:./sonar-scanner-7.0.2.4839-linux-x64/bin/
    pre_build:
        commands:
            - echo Start code scan...
            - sonar-scanner -Dsonar.projectKey=$SONAR_QUBE_PROJECT -Dsonar.sources=. -Dsonar.host.url=$SONAR_QUBE_URL -Dsonar.token=$SONAR_QUBE_TOKEN
            - sleep 7
            - "curl -s -u $SONAR_QUBE_TOKEN: $SONAR_QUBE_URL/api/qualitygates/project_status?projectKey=$SONAR_QUBE_PROJECT> result.json"
            - cat result.json
            - if [ $(jq -r '.projectStatus.status' result.json) = ERROR ] ; then CODEBUILD_BUILD_SUCCEEDING=0 ; fi
            - echo Code scan completed on `date`
            - if [ "$CODEBUILD_BUILD_SUCCEEDING" -eq 0 ]; then exit 1; fi